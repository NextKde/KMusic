name: Installer distro matrix
on:
  push:
    branches: [main, codex/music-development, codex/player-ui-refinement]
    paths: [install.sh, packaging/**, tests/installer/**, vendor/**, tools/vendor_components.py, .github/workflows/installer-matrix.yml]
  pull_request:
    paths: [install.sh, packaging/**, tests/installer/**, vendor/**, tools/vendor_components.py, .github/workflows/installer-matrix.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:base
          - name: Ubuntu 26.04
            image: ubuntu:26.04
          - name: Debian 13
            image: debian:13
          - name: Ubuntu 24.04 dependency rejection
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NextKde/NextKde
          ref: 0a7edebf3991a7cf8326eb125b7bf88374a5298c
          path: kos-tests
          persist-credentials: false
          sparse-checkout: tests/app-store
      - name: Run real installation and failure cases inside isolated distro
        env:
          IMAGE: ${{ matrix.image }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p results
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > results/container-image.json
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/results:/results" "$IMAGE" \
            bash /source/kos-tests/tests/app-store/run-kmusic-container.sh \
            /source "$REVISION" /source/kos-tests/tests/app-store /results
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/results:/results" "$IMAGE" bash -c '
            set -euo pipefail
            bash /source/kos-tests/tests/app-store/provision-kmusic-ci.sh > /results/local-provision.log 2>&1
            useradd -m installer-test
            chown -R installer-test:installer-test /results
            extra=()
            . /etc/os-release
            if [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 ]]; then extra+=(--reject-dependencies); fi
            runuser -u installer-test -- python3 /source/tests/installer/run_local_install.py --source /source --results /results/local-source "${extra[@]}"
          '
      - name: Preserve complete evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ strategy.job-index }}
          path: results
          retention-days: 14

  local-source:
    name: Local source lifecycle (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:base, 'ubuntu:26.04', 'debian:13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise local Git/CMake lifecycle and failures without source downloads
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/source:ro" "$IMAGE" bash -c '
            set -euo pipefail
            if command -v pacman >/dev/null; then
              pacman -Sy --noconfirm --needed python git cmake make shadow
            else
              apt-get update
              apt-get install -y --no-install-recommends python3 git cmake make passwd
            fi
            useradd -m installer-test
            runuser -u installer-test -- python3 -m unittest discover -s /source/tests/installer -p "test_*.py" -v
          '
